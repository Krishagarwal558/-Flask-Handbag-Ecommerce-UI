<div class="announcement-stack">
  <div class="announcement-bar">Free shipping across India</div>
  <div class="announcement-bar soft">Ask for launch offers on WhatsApp</div>
</div>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ url_for('home') }}" aria-label="BagBloom home">
      <span class="brand-mark">B</span>
      <span>BagBloom</span>
    </a>
    <button class="nav-toggle" data-nav-toggle aria-label="Open navigation">Menu</button>
    <nav class="nav-links" data-nav-links>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('products') }}">Shop</a>
      <a href="{{ url_for('orders') }}">Orders</a>
      {% if current_user and current_user.role == "admin" %}
      <a href="{{ url_for('admin_dashboard') }}">Admin</a>
      {% endif %}
    </nav>
    <div class="nav-actions">
      <button class="icon-button" data-theme-toggle aria-label="Toggle dark mode">Dark</button>
      <a class="cart-pill" href="{{ url_for('cart') }}">Cart <span data-cart-count>{{ cart_count }}</span></a>
      {% if current_user %}
      <a class="profile-link" href="{{ url_for('profile') }}">Profile</a>
      <a class="profile-link" href="{{ url_for('logout') }}">Logout</a>
      {% else %}
      <a class="profile-link" href="{{ url_for('login') }}">Login</a>
      {% endif %}
    </div>
  </div>
</header>
