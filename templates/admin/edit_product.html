{% extends "base.html" %}
{% block title %}Edit Handbag | BagBloom{% endblock %}
{% block content %}
<section class="admin-form-shell">
  <form class="form-card ajax-form" action="{{ url_for('edit_product', product_id=product.id) }}" method="post" enctype="multipart/form-data">
    <p class="eyebrow">Handbag management</p>
    <h1>Edit {{ product.name }}</h1>
    <div class="form-grid">
      <label>Handbag name <input name="name" value="{{ product.name }}" required></label>
      <label>Price <input type="number" name="price" value="{{ product.price }}" required></label>
      <label>Style <input name="category" value="{{ product.category }}"></label>
      <label>Replace image <input type="file" name="image" accept="image/*"></label>
      <label class="wide">Description <textarea name="description" rows="5">{{ product.description }}</textarea></label>
    </div>
    <button class="button button-dark" type="submit">Update handbag</button>
  </form>
</section>
{% endblock %}
