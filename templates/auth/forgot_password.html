{% extends "base.html" %}
{% block title %}Forgot Password | BagBloom{% endblock %}
{% block content %}
<section class="auth-shell">
  <form class="auth-card ajax-form" action="{{ url_for('forgot_password') }}" method="post">
    <p class="eyebrow">Password help</p>
    <h1>Reset your password</h1>
    <p class="muted">Enter your email and connect this form to your Flask mail flow.</p>
    <label>Email <input type="email" name="email" required></label>
    <button class="button button-dark full" type="submit">Send reset link</button>
  </form>
</section>
{% endblock %}
