{% extends "base.html" %}
{% block title %}Login | BagBloom{% endblock %}
{% block content %}
<section class="auth-shell">
  <form class="auth-card ajax-form" action="{{ url_for('login', next=request.args.get('next')) }}" method="post">
    <p class="eyebrow">Welcome back</p>
    <h1>Login to BagBloom</h1>
    <label>Email <input type="email" name="email" required placeholder="you@example.com"></label>
    <label>Password <input type="password" name="password" required placeholder="Password"></label>
    <button class="button button-dark full" type="submit">Login</button>
    <div class="auth-links">
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
      <a href="{{ url_for('register') }}">Create account</a>
    </div>
  </form>
</section>
{% endblock %}
